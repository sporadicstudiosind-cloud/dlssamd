[package]
name = "gs-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
eframe = "0.36.2"
egui = "0.36.2"
env_logger = "0.11.11"
gs-core = { version = "0.1.0", path = "../gs-core" }
log = "0.4.34"
pollster = "1.0.1"
serde = "1.0.229"
toml = "1.1.6"
wgpu = "30.0.1"
winit = "0.30.13"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Graphics_Dwm", "Win32_Media"] }
windows-capture = "2.0.1"
